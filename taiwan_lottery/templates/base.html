<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="賓果賓果三星、四星、五星即時資料、事前封存、多模型投票與嚴格樣本外比較。"
    />
    <title>{% block title %}賓果研究室{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main">跳至主要內容</a>
    <header class="site-header">
      <nav class="nav-shell" aria-label="主要導覽">
        <a class="brand" href="/"
          ><span class="brand-mark" aria-hidden="true">B</span
          ><span>賓果研究室<small>台灣賓果賓果・三星至五星</small></span></a
        >
        <div class="nav-links">
          <a href="/" data-nav="dashboard">即時總覽</a
          ><a href="/analysis/bingo" data-nav="analysis">分析與盲測</a>
        </div>
      </nav>
    </header>
    <main id="main" class="page-shell">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <span>依事前封存、事後結算的紀錄比較模型。</span
      ><span>開獎為隨機事件；相對信心不代表中獎機率。</span>
    </footer>
    <script src="/static/js/bingo.js" defer></script>
    <script src="/static/js/intelligence.js" defer></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
